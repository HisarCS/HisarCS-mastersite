name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

# Note: there is no e2e suite in CI. The old Playwright suite (which drove the
# static site + read config.js) was removed in the Next migration; `npm test`
# now runs the vitest unit suite. A Next-aware e2e (Playwright vs. the built
# `out/` + supabase/setup-cli `supabase start`) could be added here later.
