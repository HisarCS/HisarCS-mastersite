name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  # E2E: Playwright drives the built static export (exactly what Pages serves)
  # in Chromium, with Supabase mocked at the network edge — no live stack, no
  # GitHub, fully deterministic. See tests/e2e/ and playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static export
        run: npm run build
      - name: E2E tests
        run: npm run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Screenshot gallery: every page at desktop + phone size, rebuilt on every
  # push and PR so reviewers can see the iteration without running anything.
  # Not a pass/fail diff — see playwright.screens.config.ts.
  screens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static export
        run: npm run build
      - name: Capture every page
        run: npm run screens
      - name: Upload gallery
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.sha }}
          path: screens/
          retention-days: 30
      - name: Summary
        run: |
          echo "### Screenshot gallery" >> "$GITHUB_STEP_SUMMARY"
          echo "Every page at desktop + phone size: [download](${{ steps.upload.outputs.artifact-url }}), unzip, open \`index.html\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- screens-gallery -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Screenshot gallery** for ${sha} — every page at desktop + phone size.\n[Download](${process.env.ARTIFACT_URL}), unzip, open \`index.html\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
