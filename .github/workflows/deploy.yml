name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild: member research published since the last deploy gets its
  # share page (/r/<slug>/ — link-preview tags, ADR-0021) within a day.
  schedule:
    - cron: '17 3 * * *'

# Permissions the Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes cancel in-flight runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site's sub-path today. When the root moves, change THIS line only
          # (or clear it for a root deploy).
          NEXT_PUBLIC_BASE_PATH: /HisarCS-mastersite
          # Build share pages for published member research too (read-only,
          # public anon key). Local/test builds leave this unset and stay offline.
          SHARE_PAGES_FROM_DB: '1'
      # GitHub Pages serves _next/… fine, but never runs Jekyll on our output.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
